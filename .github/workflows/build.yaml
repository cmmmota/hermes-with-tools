name: Build and push to Gitea

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build.yaml
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Job pods have no Docker daemon: the build runs on the cluster's
      # buildkitd (k8s_homelab kubernetes/apps/buildkit), reachable only from
      # the runner's job pods.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234

      # Gitea's registry refuses the job token (it carries no package scope),
      # so pushes use ci-bot's write:package token, a BCDHome org secret.
      - name: Log in to Gitea
        uses: docker/login-action@v4
        with:
          registry: gitea.bcdhome.net
          username: ci-bot
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Read base image version
        id: base
        run: |
          version=$(sed -n -E 's/^FROM nousresearch\/hermes-agent:([^@[:space:]]+).*/\1/p' Dockerfile)
          if [ -z "$version" ]; then
            echo "::error file=Dockerfile::Could not read nousresearch/hermes-agent tag from FROM line"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: gitea.bcdhome.net/${{ github.repository }}
          # <base> moves to the newest build on that base version;
          # <base>-<sha> is immutable and pins an exact build.
          tags: |
            type=raw,value=${{ steps.base.outputs.version }},priority=1000
            type=raw,value=${{ steps.base.outputs.version }}-{{sha}},priority=900
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.base.name=docker.io/nousresearch/hermes-agent:${{ steps.base.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
